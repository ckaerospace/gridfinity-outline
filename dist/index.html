<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0e0f11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
<title>Outline</title>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
</head>
<body>
<div id="app">
  <header class="top">
    <button id="btnProjects" class="projbtn" aria-label="Projects"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span id="projName">Untitled</span></button>
    <div class="hist"><button id="btnUndo" class="icon" aria-label="Undo" disabled><svg viewBox="0 0 24 24" width="20" height="20"><path d="M9 7 4 12l5 5M4 12h11a5 5 0 0 1 0 10h-2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button><button id="btnRedo" class="icon" aria-label="Redo" disabled><svg viewBox="0 0 24 24" width="20" height="20"><path d="m15 7 5 5-5 5M20 12H9a5 5 0 0 0 0 10h2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div>
  </header>
  <nav class="steps" id="steps" aria-label="Steps"><button data-step="photo"><i>1</i>Photo</button><button data-step="outline"><i>2</i>Outline</button><button data-step="bin" class="on"><i>3</i>Bin</button><button data-step="export"><i>4</i>Export</button></nav>

  <div class="viewrow">
    <div class="seg" id="viewSeg" role="tablist"><button data-view="plan" class="on">2D</button><button data-view="3d">3D</button></div>
    <button id="btnArr" class="pill" hidden>Arrange</button><button id="btnArrUndo" class="pill" hidden>Undo arrange</button><button id="btnArrOpt" class="pill icon" aria-label="Arrange options" hidden>⋯</button>
    <button id="btnBin" class="pill" aria-label="Bin settings">Bin</button>
  </div>
  <div class="arrmsg" id="arrMsg" hidden></div>
  <div id="arrBar" hidden></div>

  <section id="stage" class="stage">
    <svg id="plan" xmlns="http://www.w3.org/2000/svg"></svg>
    <div id="view3d" class="view3d" hidden><div id="labels3d"></div><button id="btnCut" class="cutbtn" hidden>Cutaway</button></div>
    <div id="empty" class="empty" hidden>
      <svg viewBox="0 0 64 64" width="56" height="56" aria-hidden="true"><rect x="8" y="14" width="48" height="36" rx="5" fill="none" stroke="currentColor" stroke-width="2.5" opacity=".5"/><path d="M20 38c4-10 10-12 14-6s8 6 10-2" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
      <p class="big">Start with a photo</p>
      <p class="muted">Lay an object on the printed sheet and shoot it from above.</p>
      <a class="link" href="sheet.html">Print the sheet (A4 / Letter)</a>
    </div>
    <div id="notchHint" class="hint" hidden>Tap the pocket edge to place a notch</div>
    <div id="stats" class="stats"></div>
  </section>

  <section class="panel" id="panel">
    <div class="chips" id="chips"></div>
    <div id="objPanel"></div>
  </section>

  <footer class="bar">
    <button id="btnAdd" class="secondary addbtn" aria-label="Add object">+ Add</button>
    <button id="btnExport" class="primary">Export</button>
  </footer>
</div>

<div id="capture" class="overlay" hidden></div>
<div id="projects" class="overlay" hidden></div>
<div id="intro" class="overlay intro" hidden></div>
<div id="sheetDlg" class="sheetdlg" hidden></div>
<div id="toast" class="toast" hidden></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
